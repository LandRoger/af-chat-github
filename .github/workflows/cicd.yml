name: LLM Chatbot CI/CD
on:
  push:
    branches: [ main ]

job:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build
        run: |
          echo "Building the project..."
          python -m compileall .
  test:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        run: |
          pytest test_llm.py

  deploy:
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to Streamlit
        run: |
          echo "Deploying to Streamlit..."
          # Add your deployment commands here, for example: streamlit run app.py.
          streamlit run app.py --server.port 8501 --server.address

       